plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"


    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    shadowBundle "com.github.stephengold:jolt-jni-Windows64:$rootProject.jolt_version"
    shadowBundle "com.github.stephengold:jolt-jni-Windows64:$rootProject.jolt_version:ReleaseDp"
    shadowBundle "com.github.stephengold:jolt-jni-Linux64:$rootProject.jolt_version:ReleaseDp"

    runtimeOnly "com.github.stephengold:jolt-jni-Windows64:$rootProject.jolt_version"
    runtimeOnly "com.github.stephengold:jolt-jni-Windows64:$rootProject.jolt_version:ReleaseDp"
    runtimeOnly "com.github.stephengold:jolt-jni-Linux64:$rootProject.jolt_version:ReleaseDp"

    modCompileOnly files(rootProject.file("libs/dev.ryanhcode.sable.sable-sable_rapier-1.21.1-2.0.5.jar"))
    modLocalRuntime files(rootProject.file("libs/dev.ryanhcode.sable.sable-sable_rapier-1.21.1-2.0.5.jar"))
    modLocalRuntime files(rootProject.file("libs/sable-neoforge-1.21.1-2.0.5.jar"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    input.set shadowJar.archiveFile
}
